<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#128c7e">
<title>Suhbat</title>
<style>
:root{--bg:#efeae2;--sf:#fff;--tx:#111b21;--mu:#667781;--ac:#128c7e;--me:#d9fdd3;--ot:#fff;--ln:#e2e6e8;--rd:#e53935;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b141a;--sf:#111b21;--tx:#e9edef;--mu:#8696a0;--ac:#25b39e;--me:#005c4b;--ot:#202c33;--ln:#222d34}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:auto;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}.screen.on{display:flex}
header{padding:12px 14px;background:var(--ac);color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.list,.msgs{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--ln);cursor:pointer;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.grow{flex:1;min-width:0}.nm{font-weight:600}
.sub{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{padding:12px;display:flex;flex-direction:column;gap:5px}
.b{max-width:80%;padding:7px 10px;border-radius:10px;background:var(--ot);line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--me)}
.b small{display:block;text-align:right;color:var(--mu);font-size:11px}
.b img,.b video{max-width:100%;border-radius:8px;display:block}
.b a{color:var(--ac)}
.bar{display:flex;gap:8px;padding:10px;background:var(--sf);align-items:center}
input[type=text],input[type=email]{flex:1;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:22px;padding:11px 16px;font-size:16px;outline:none;min-width:0}
button{font:inherit;border:0;cursor:pointer}
.ib{background:none;font-size:22px;padding:4px 6px;color:inherit}
.send{background:var(--ac);color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;flex:none}
.hb{background:none;color:#fff;font-size:24px;padding:0 4px;line-height:1}
.center{margin:auto;width:100%;padding:28px;display:flex;flex-direction:column;gap:14px;background:var(--sf);text-align:center}
.go{background:var(--ac);color:#fff;border-radius:10px;padding:13px;font-weight:700}
.note{color:var(--mu);font-size:13px}.err{color:var(--rd);font-size:14px;min-height:18px}
.empty{padding:24px;color:var(--mu);text-align:center}
.foot{padding:10px 16px;background:var(--sf)}.lnk{background:none;color:var(--ac);font-size:13px;text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}.ov.on{display:flex}
.card{background:var(--sf);width:100%;max-width:560px;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:12px}
.card .r,.inc .r{display:flex;gap:10px}.card .r button,.inc .r button{flex:1;padding:12px;border-radius:10px}
.cn{background:var(--ln);color:var(--tx)}
.call{position:fixed;inset:0;background:#0b141a;z-index:20;display:none;color:#fff}.call.on{display:block}
#rv{width:100%;height:100%;object-fit:cover;background:#0b141a}
#lv{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:96px;height:136px;object-fit:cover;border-radius:10px;background:#222;border:1px solid #fff4}
.ci{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;text-shadow:0 1px 4px #000}
.ci #cn{font-size:26px;font-weight:600}
.cb{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:22px}
.cb button{width:62px;height:62px;border-radius:50%;background:#fff3;color:#fff;font-size:24px}
.cb .red,.inc .red{background:var(--rd);color:#fff}
.inc{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--sf);border-radius:16px;padding:16px;z-index:30;display:none;flex-direction:column;gap:10px;box-shadow:0 6px 24px #0006;max-width:536px;margin:auto}
.inc.on{display:flex}.inc .green{background:var(--ac);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 14px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40}.toast.on{opacity:1}
.sn{font-size:12px;font-weight:700;color:var(--ac)}.btnl{background:var(--ln);color:var(--tx);border-radius:10px;padding:14px;text-align:left;font-size:16px}.code{background:var(--bg);padding:8px;border-radius:8px;word-break:break-all;user-select:all;font-family:monospace;font-size:13px}.hr{height:1px;background:var(--ln)}.card input[type=text],.card input[type=email]{flex:none;width:100%;border-radius:10px}.card .r input{flex:1;width:auto}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="setup" class="screen on"><div class="center"><h2>Sozlash kerak</h2><div class="note">Faylning boshidagi <b>FIREBASE_CONFIG</b> to‘ldirilmagan. Ko‘rsatma bo‘yicha Firebase sozlamalarini kiriting.</div></div></div>

<div id="login" class="screen"><div class="center"><h1>Suhbat</h1><div class="note">Xabar, rasm, ovozli va video qo‘ng‘iroq</div>
<button class="go" id="gbtn">Google bilan kirish</button><div class="err" id="lerr"></div></div></div>

<div id="home" class="screen">
  <header><span style="flex:1">Suhbat</span><button class="hb" id="add" aria-label="Yangi suhbat">＋</button></header>
  <div class="list" id="clist"></div>
  <div class="note foot"><span id="mename"></span> · <button class="lnk" id="out">Chiqish</button></div>
</div>

<div id="chat" class="screen">
  <header><button class="hb" id="bk" aria-label="Orqaga">‹</button><div class="av" id="cav" style="background:#0003"></div><span id="cnm" style="flex:1"></span><button class="ib" id="ri" aria-label="Ma‘lumot" style="display:none">ⓘ</button><button class="ib" id="ca" aria-label="Ovozli qo‘ng‘iroq">📞</button><button class="ib" id="cv" aria-label="Video qo‘ng‘iroq">🎥</button></header>
  <div class="msgs" id="msgs"></div>
  <div class="note foot" id="chnote" style="display:none;text-align:center">Faqat kanal egasi yozadi</div><div class="bar" id="bar"><button class="ib" id="pic" aria-label="Rasm">📷</button><input type="file" id="file" accept="image/*" hidden><input type="text" id="inp" placeholder="Xabar yoki havola" autocomplete="off"><button class="send" id="snd" aria-label="Yuborish">➤</button></div>
</div>

<div class="ov" id="ov"><div class="card"><h2>Yangi suhbat</h2>
<input type="email" id="aem" placeholder="Do‘stingizning Gmail manzili">
<div class="note">Do‘stingiz ilovaga Google bilan kamida bir marta kirgan bo‘lishi kerak.</div>
<div class="err" id="aerr"></div>
<div class="r"><button class="cn" id="acl">Bekor qilish</button><button class="go" id="ago">Boshlash</button></div></div></div>

<div class="ov" id="ov2"><div class="card" id="card2"></div></div>

<div class="call" id="call"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
<div class="ci"><div id="cn"></div><div id="cst"></div></div>
<div class="cb"><button id="cmute" aria-label="Ovozsiz">🎤</button><button id="ccam" aria-label="Kamera">📷</button><button class="red" id="chang" aria-label="Tugatish">✕</button></div></div>

<div class="inc" id="inc"><b id="in" style="font-size:20px"></b><div id="it" class="note"></div>
<div class="r"><button class="red" id="idec">Rad etish</button><button class="green" id="iacc">Javob berish</button></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyCOvrRPI9EYL46fwNeUcOgzfxBd3zp9bis",authDomain:"bisis-2b54d.firebaseapp.com",projectId:"bisis-2b54d",appId:"1:265491574646:web:5f47a5cc0a6b8c47179457"};
var ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};

function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function hm(t){var d=new Date(t||Date.now());return("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function scr(id){["setup","login","home","chat"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},2400)}
function linkify(t){
  return esc(t).replace(/https?:\/\/[^\s<]+/g,function(u){
    if(/\.(mp4|webm|mov)(\?|#|$)/i.test(u))return'<video controls playsinline preload="metadata" src="'+u+'"></video>';
    if(/\.(jpe?g|png|gif|webp)(\?|#|$)/i.test(u))return'<img src="'+u+'" alt="">';
    return'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>';
  });
}

if(!FIREBASE_CONFIG.apiKey||typeof firebase==="undefined"){scr("setup")}else{init()}

function init(){
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth=firebase.auth(),db=firebase.firestore();
  var me=null,cur=null,chatsUnsub=null,msgsUnsub=null,callWatch={},chatsCache={};
  var roomsUnsub=null,roomsCache={},chatList=[],roomList=[],botUnsubs={},botStart=Date.now();
  var pc=null,localStream=null,inCall=false,callCid=null,callId=null,pending=[],ansUnsub=null,candUnsub=null,ringTimer=null,incoming=null;

  /* --- kirish --- */
  $("gbtn").onclick=function(){
    $("lerr").textContent="";
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){$("lerr").textContent="Kirib bo‘lmadi: "+(e.code||e.message)});
  };
  $("out").onclick=function(){auth.signOut()};
  auth.onAuthStateChanged(function(u){
    if(!u){me=null;teardown();scr("login");return}
    me=u;
    db.collection("users").doc(u.uid).set({name:u.displayName||u.email,email:u.email||"",emailLower:(u.email||"").toLowerCase(),photo:u.photoURL||""},{merge:true}).catch(function(){});
    $("mename").textContent=u.displayName||u.email;
    scr("home");watchChats();watchRooms();
  });
  function teardown(){
    if(chatsUnsub)chatsUnsub();if(msgsUnsub)msgsUnsub();chatsUnsub=msgsUnsub=null;
    Object.keys(callWatch).forEach(function(k){callWatch[k]()});callWatch={};chatsCache={};
    if(roomsUnsub)roomsUnsub();roomsUnsub=null;Object.keys(botUnsubs).forEach(function(k){botUnsubs[k]()});botUnsubs={};roomsCache={};chatList=[];roomList=[];
    endCall(false);hideIncoming();cur=null;
  }

  /* --- suhbatlar ro'yxati --- */
  function otherOf(c){return c.members.filter(function(m){return m!==me.uid})[0]}
  function watchChats(){
    if(chatsUnsub)chatsUnsub();
    chatsUnsub=db.collection("chats").where("members","array-contains",me.uid).onSnapshot(function(s){
      var list=[];
      s.forEach(function(d){var x=d.data();x.id=d.id;chatsCache[d.id]=x;list.push(x);watchCall(d.id)});
      chatList=list;renderHome();
    },function(e){$("clist").innerHTML='<div class="empty">Xato: '+esc(e.code||e.message)+'<br>Firestore qoidalarini tekshiring.</div>'});
  }
  function rowOpen(e){var r=e.target.closest(".row");if(!r)return;if(r.dataset.r)openRoom(r.dataset.r);else openChat(r.dataset.u,r.dataset.n)}
  function renderHome(){
    var items=[];
    chatList.forEach(function(c){var o=otherOf(c),n=(c.names&&c.names[o])||"Foydalanuvchi";items.push({t:c.lastT||0,h:'<div class="row" tabindex="0" data-u="'+esc(o)+'" data-n="'+esc(n)+'"><div class="av">'+esc(n[0].toUpperCase())+'</div><div class="grow"><div class="nm">'+esc(n)+'</div><div class="sub">'+esc(c.last||"")+'</div></div></div>'})});
    roomList.forEach(function(r){items.push({t:r.lastT||0,h:'<div class="row" tabindex="0" data-r="'+esc(r.id)+'"><div class="av">'+(r.type==="channel"?"📢":"👥")+'</div><div class="grow"><div class="nm">'+esc(r.name)+'</div><div class="sub">'+esc(r.last||(r.type==="channel"?"Kanal":"Guruh"))+'</div></div></div>'})});
    items.sort(function(a,b){return b.t-a.t});
    $("clist").innerHTML=items.length?items.map(function(i){return i.h}).join(""):'<div class="empty">Hali suhbat yo‘q. ＋ ni bosib suhbat, guruh yoki kanal oching.</div>';
  }
  function watchRooms(){
    if(roomsUnsub)roomsUnsub();
    roomsUnsub=db.collection("rooms").where("members","array-contains",me.uid).onSnapshot(function(s){
      roomList=[];
      s.forEach(function(d){var x=d.data();x.id=d.id;roomsCache[d.id]=x;roomList.push(x);if(x.owner===me.uid)runBot(d.id)});
      renderHome();
    },function(){});
  }
  function runBot(rid){
    if(botUnsubs[rid])return;
    var ref=db.collection("rooms").doc(rid).collection("messages");
    botUnsubs[rid]=ref.where("t",">",botStart).orderBy("t").onSnapshot(function(s){
      s.docChanges().forEach(function(ch){
        if(ch.type!=="added")return;
        var x=ch.doc.data(),r=roomsCache[rid];
        if(!r||x.bot||!r.bots||!r.bots.length||typeof x.text!=="string"||x.text.charAt(0)!=="/")return;
        var cmd=x.text.trim().split(/\s+/)[0].toLowerCase(),rep=null;
        r.bots.forEach(function(b){if(b.cmd===cmd)rep=b.reply});
        if(!rep&&cmd==="/vaqt")rep="Hozir "+hm();
        if(!rep&&cmd==="/yordam")rep="Buyruqlar: "+r.bots.map(function(b){return b.cmd}).concat(["/vaqt","/yordam"]).join(" ");
        if(rep)ref.doc("bot_"+ch.doc.id).set({from:me.uid,fromName:"Bot",bot:true,text:rep,t:Date.now()}).catch(function(){});
      });
    },function(){});
  }
  function roomUi(on,r){
    $("ca").style.display=$("cv").style.display=on?"none":"";
    $("ri").style.display=on?"":"none";
    var ro=!!(on&&r&&r.type==="channel"&&r.owner!==me.uid);
    $("bar").style.display=ro?"none":"";$("chnote").style.display=ro?"":"none";
  }
  function openRoom(id){var r=roomsCache[id];if(r)openRoomData(id,r)}
  function openRoomData(id,r){
    cur={room:true,rid:id,name:r.name,type:r.type,owner:r.owner};
    var ic=r.type==="channel"?"📢":"👥";
    $("cnm").textContent=ic+" "+r.name;$("cav").textContent=ic;$("msgs").innerHTML="";
    roomUi(true,r);
    if(msgsUnsub)msgsUnsub();
    msgsUnsub=db.collection("rooms").doc(id).collection("messages").orderBy("t").limitToLast(100).onSnapshot(function(s){
      var h="";
      s.forEach(function(d){
        var m=d.data(),mine=m.from===me.uid&&!m.bot;
        h+='<div class="b'+(mine?" me":"")+'">'+(mine?"":'<div class="sn">'+(m.bot?"🤖 ":"")+esc(m.fromName||"")+'</div>')+(m.img?'<img src="'+esc(m.img)+'" alt="">':"")+(m.text?linkify(m.text):"")+'<small>'+hm(m.t)+'</small></div>';
      });
      $("msgs").innerHTML=h;$("msgs").scrollTop=1e7;
    },function(){toast("Xabarlarni o‘qib bo‘lmadi")});
    scr("chat");
  }
  function sendRoom(data){
    var c=cur,ref=db.collection("rooms").doc(c.rid);
    return ref.collection("messages").add(Object.assign({from:me.uid,fromName:me.displayName||me.email,t:Date.now()},data))
      .then(function(){return ref.update({last:data.text||"📷 Rasm",lastT:Date.now()})})
      .catch(function(){toast("Yuborib bo‘lmadi")});
  }
  function sheet(h){$("card2").innerHTML=h;$("ov2").classList.add("on")}
  function closeSheet(){$("ov2").classList.remove("on")}
  function menu(){sheet('<h2>Yangi</h2><button class="btnl" data-a="chat">💬 Yangi suhbat (Gmail bilan)</button><button class="btnl" data-a="group">👥 Guruh yaratish</button><button class="btnl" data-a="channel">📢 Kanal yaratish</button><button class="btnl" data-a="join">🔗 Kod bilan qo‘shilish</button>')}
  function openNew(){closeSheet();$("aem").value="";$("aerr").textContent="";$("ov").classList.add("on");$("aem").focus()}
  function info(){
    var r=roomsCache[cur.rid];if(!r)return;var own=r.owner===me.uid;
    var h='<h2>'+esc(r.name)+'</h2><div class="note">'+(r.type==="channel"?"Kanal":"Guruh")+' · '+r.members.length+' a‘zo</div><div class="note">Qo‘shilish kodi (do‘stlarga yuboring):</div><div class="code">'+esc(r.id)+'</div>';
    if(own){
      h+='<div class="hr"></div><div class="note">A‘zo qo‘shish (Gmail):</div><div class="r"><input type="email" id="mem" placeholder="Gmail"><button class="go" data-a="addm">Qo‘shish</button></div>';
      h+='<div class="hr"></div><div class="note">Bot buyruqlari (ilovangiz ochiq turganda javob beradi). Tayyor buyruqlar: /vaqt, /yordam</div>';
      (r.bots||[]).forEach(function(b,i){h+='<div class="r"><div class="grow"><b>'+esc(b.cmd)+'</b> → '+esc(b.reply)+'</div><button class="cn" data-a="delb" data-i="'+i+'">✕</button></div>'});
      h+='<input type="text" id="bc" placeholder="/buyruq" maxlength="20"><input type="text" id="br" placeholder="Bot javobi" maxlength="300"><button class="go" data-a="addb">Bot buyrug‘i qo‘shish</button>';
    }
    h+='<div class="err" id="ierr"></div><button class="cn" data-a="x" style="padding:12px;border-radius:10px">Yopish</button>';
    sheet(h);
  }
  $("ri").onclick=info;
  $("ov2").addEventListener("click",function(e){
    if(e.target===this){closeSheet();return}
    var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
    if(a==="x")closeSheet();
    else if(a==="chat")openNew();
    else if(a==="group"||a==="channel"){
      sheet('<h2>'+(a==="channel"?"Kanal":"Guruh")+' yaratish</h2><input type="text" id="rn" placeholder="Nomi" maxlength="40"><div class="err" id="rerr"></div><div class="r"><button class="cn" data-a="x">Bekor qilish</button><button class="go" data-a="mk" data-t="'+a+'">Yaratish</button></div>');$("rn").focus();
    }
    else if(a==="join")sheet('<h2>Kod bilan qo‘shilish</h2><input type="text" id="jc" placeholder="Guruh yoki kanal kodi"><div class="err" id="jerr"></div><div class="r"><button class="cn" data-a="x">Bekor qilish</button><button class="go" data-a="jn">Qo‘shilish</button></div>');
    else if(a==="mk"){
      var nm=$("rn").value.trim();if(nm.length<2){$("rerr").textContent="Nomini yozing.";return}
      var ref=db.collection("rooms").doc(),data={type:b.dataset.t,name:nm,owner:me.uid,members:[me.uid],bots:[],last:"",lastT:Date.now()};
      ref.set(data).then(function(){closeSheet();data.id=ref.id;roomsCache[ref.id]=data;openRoomData(ref.id,data)}).catch(function(){$("rerr").textContent="Yaratib bo‘lmadi."});
    }
    else if(a==="jn"){
      var code=$("jc").value.trim();if(!code)return;
      db.collection("rooms").doc(code).get().then(function(d){
        if(!d.exists){$("jerr").textContent="Bunday kod topilmadi.";return}
        var x=d.data();x.id=d.id;
        if(x.members.indexOf(me.uid)>-1){closeSheet();roomsCache[d.id]=x;openRoomData(d.id,x);return}
        return d.ref.update({members:firebase.firestore.FieldValue.arrayUnion(me.uid)}).then(function(){closeSheet();x.members.push(me.uid);roomsCache[d.id]=x;openRoomData(d.id,x)});
      }).catch(function(){$("jerr").textContent="Qo‘shilib bo‘lmadi."});
    }
    else if(a==="addm"){
      var em=$("mem").value.trim().toLowerCase();if(!em)return;
      db.collection("users").where("emailLower","==",em).limit(1).get().then(function(q){
        if(q.empty){$("ierr").textContent="Bu pochta egasi hali ilovaga kirmagan.";return}
        return db.collection("rooms").doc(cur.rid).update({members:firebase.firestore.FieldValue.arrayUnion(q.docs[0].id)}).then(function(){toast("Qo‘shildi");$("mem").value=""});
      }).catch(function(){$("ierr").textContent="Qo‘shib bo‘lmadi."});
    }
    else if(a==="addb"){
      var c=$("bc").value.trim().toLowerCase(),t=$("br").value.trim();
      if(c.charAt(0)!=="/"||c.length<2||!t){$("ierr").textContent="Buyruq / bilan boshlansin va javob yozilsin.";return}
      var r=roomsCache[cur.rid],bots=(r.bots||[]).concat([{cmd:c.split(/\s+/)[0],reply:t}]).slice(0,20);
      db.collection("rooms").doc(cur.rid).update({bots:bots}).then(function(){r.bots=bots;info()}).catch(function(){$("ierr").textContent="Saqlab bo‘lmadi."});
    }
    else if(a==="delb"){
      var r2=roomsCache[cur.rid],nb=(r2.bots||[]).filter(function(_,i){return i!==Number(b.dataset.i)});
      db.collection("rooms").doc(cur.rid).update({bots:nb}).then(function(){r2.bots=nb;info()}).catch(function(){$("ierr").textContent="Saqlab bo‘lmadi."});
    }
  });
  $("clist").addEventListener("click",rowOpen);
  $("clist").addEventListener("keydown",function(e){if(e.key==="Enter")rowOpen(e)});

  $("add").onclick=function(){menu()};
  $("acl").onclick=function(){$("ov").classList.remove("on")};
  $("ago").onclick=function(){
    var em=$("aem").value.trim().toLowerCase();if(!em)return;
    if(em===(me.email||"").toLowerCase()){$("aerr").textContent="O‘zingizga yozib bo‘lmaydi.";return}
    db.collection("users").where("emailLower","==",em).limit(1).get().then(function(q){
      if(q.empty){$("aerr").textContent="Bu pochta egasi hali ilovaga kirmagan.";return}
      var d=q.docs[0];$("ov").classList.remove("on");openChat(d.id,d.data().name||em);
    }).catch(function(){$("aerr").textContent="Qidirib bo‘lmadi."});
  };

  /* --- chat --- */
  function openChat(uid,name){
    var cid=[me.uid,uid].sort().join("_");
    cur={cid:cid,uid:uid,name:name};roomUi(false);
    $("cnm").textContent=name;$("cav").textContent=name[0].toUpperCase();$("msgs").innerHTML="";
    if(msgsUnsub)msgsUnsub();
    msgsUnsub=db.collection("chats").doc(cid).collection("messages").orderBy("t").limitToLast(100).onSnapshot(function(s){
      var h="";
      s.forEach(function(d){
        var m=d.data(),mine=m.from===me.uid;
        h+='<div class="b'+(mine?" me":"")+'">'+(m.img?'<img src="'+esc(m.img)+'" alt="">':"")+(m.text?linkify(m.text):"")+'<small>'+hm(m.t)+'</small></div>';
      });
      $("msgs").innerHTML=h;$("msgs").scrollTop=1e7;
    },function(){toast("Xabarlarni o‘qib bo‘lmadi")});
    scr("chat");
  }
  $("bk").onclick=function(){if(msgsUnsub)msgsUnsub();msgsUnsub=null;cur=null;scr("home")};
  function sendMsg(data){
    if(!cur)return Promise.resolve();
    if(cur.room)return sendRoom(data);
    var c=cur,names={};names[me.uid]=me.displayName||me.email;names[c.uid]=c.name;
    var ref=db.collection("chats").doc(c.cid);
    return ref.set({members:[me.uid,c.uid],names:names,last:data.text||"📷 Rasm",lastT:Date.now()},{merge:true})
      .then(function(){return ref.collection("messages").add(Object.assign({from:me.uid,t:Date.now()},data))})
      .catch(function(){toast("Yuborib bo‘lmadi")});
  }
  function sendText(){var t=$("inp").value.trim();if(!t)return;$("inp").value="";sendMsg({text:t.slice(0,2000)})}
  $("snd").onclick=sendText;
  $("inp").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing)sendText()});
  $("pic").onclick=function(){$("file").click()};
  $("file").onchange=function(){
    var f=this.files[0];this.value="";if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        var u=c.toDataURL("image/jpeg",.6);
        if(u.length>900000){toast("Rasm juda katta");return}
        sendMsg({img:u});
      };
      im.onerror=function(){toast("Rasmni ochib bo‘lmadi")};
      im.src=r.result;
    };
    r.readAsDataURL(f);
  };

  /* --- qo'ng'iroqlar (WebRTC) --- */
  function callRef(cid){return db.collection("chats").doc(cid).collection("call").doc("current")}
  function media(type){return navigator.mediaDevices.getUserMedia({audio:true,video:type==="video"?{facingMode:"user"}:false})}
  function showCall(name,type,st){
    $("cn").textContent=name;$("cst").textContent=st;
    $("lv").style.display=type==="video"?"block":"none";$("ccam").style.display=type==="video"?"":"none";
    $("lv").srcObject=localStream;$("call").classList.add("on");
  }
  function mkPc(ref){
    pc=new RTCPeerConnection(ICE);
    localStream.getTracks().forEach(function(t){pc.addTrack(t,localStream)});
    pc.ontrack=function(e){$("rv").srcObject=e.streams[0]};
    pc.onicecandidate=function(e){if(e.candidate)ref.collection("cand").add({from:me.uid,id:callId,c:JSON.stringify(e.candidate)})};
    pc.onconnectionstatechange=function(){if(pc&&pc.connectionState==="failed"){toast("Ulanib bo‘lmadi");endCall(true)}};
    candUnsub=ref.collection("cand").onSnapshot(function(s){
      s.docChanges().forEach(function(ch){
        if(ch.type!=="added")return;
        var x=ch.doc.data();if(x.from===me.uid||x.id!==callId)return;
        var c=JSON.parse(x.c);
        if(pc&&pc.remoteDescription)pc.addIceCandidate(c).catch(function(){});else pending.push(c);
      });
    });
  }
  function flush(){pending.forEach(function(c){pc&&pc.addIceCandidate(c).catch(function(){})});pending=[]}
  function startCall(type){
    if(inCall||!cur)return;
    var c=cur;
    media(type).then(function(st){
      localStream=st;inCall=true;callCid=c.cid;callId=String(Date.now());pending=[];
      var ref=callRef(callCid);mkPc(ref);showCall(c.name,type,"Qo‘ng‘iroq qilinmoqda…");
      return pc.createOffer().then(function(o){return pc.setLocalDescription(o).then(function(){
        return ref.set({from:me.uid,to:c.uid,type:type,callId:callId,offer:{type:o.type,sdp:o.sdp},state:"ringing",t:Date.now()});
      })}).then(function(){
        var myId=callId;
        ansUnsub=ref.onSnapshot(function(d){
          var x=d.data();if(!x||x.callId!==myId||!pc)return;
          if(x.answer&&!pc.remoteDescription){pc.setRemoteDescription(x.answer).then(function(){flush();$("cst").textContent="Suhbat"})}
          if(x.state==="ended"||x.state==="declined"){toast(x.state==="declined"?"Rad etildi":"Qo‘ng‘iroq tugadi");endCall(false)}
        });
        ringTimer=setTimeout(function(){if(inCall&&pc&&!pc.remoteDescription){toast("Javob bermadi");endCall(true)}},45000);
      });
    }).catch(function(){toast("Kamera/mikrofonga ruxsat bering");endCall(false)});
  }
  $("ca").onclick=function(){startCall("audio")};
  $("cv").onclick=function(){startCall("video")};
  function watchCall(cid){
    if(callWatch[cid])return;
    callWatch[cid]=callRef(cid).onSnapshot(function(d){
      var x=d.data();if(!x||x.to!==me.uid)return;
      if(x.state==="ringing"&&Date.now()-x.t<50000&&!inCall&&!incoming){incoming={cid:cid,x:x};showIncoming()}
      else if(x.state!=="ringing"&&incoming&&incoming.cid===cid&&incoming.x.callId===x.callId){hideIncoming()}
    },function(){});
  }
  function incName(){var c=chatsCache[incoming.cid];return(c&&c.names&&c.names[incoming.x.from])||"Foydalanuvchi"}
  function showIncoming(){$("in").textContent=incName();$("it").textContent=incoming.x.type==="video"?"Video qo‘ng‘iroq":"Ovozli qo‘ng‘iroq";$("inc").classList.add("on")}
  function hideIncoming(){incoming=null;$("inc").classList.remove("on")}
  $("idec").onclick=function(){if(!incoming)return;callRef(incoming.cid).update({state:"declined"}).catch(function(){});hideIncoming()};
  $("iacc").onclick=function(){
    if(!incoming)return;
    var inc=incoming,name=incName();hideIncoming();
    media(inc.x.type).then(function(st){
      localStream=st;inCall=true;callCid=inc.cid;callId=inc.x.callId;pending=[];
      var ref=callRef(callCid);mkPc(ref);showCall(name,inc.x.type,"Ulanmoqda…");
      return pc.setRemoteDescription(inc.x.offer).then(function(){flush();return pc.createAnswer()})
        .then(function(a){return pc.setLocalDescription(a).then(function(){return ref.update({answer:{type:a.type,sdp:a.sdp},state:"active"})})})
        .then(function(){
          $("cst").textContent="Suhbat";var myId=callId;
          ansUnsub=ref.onSnapshot(function(d){var x=d.data();if(x&&x.callId===myId&&x.state==="ended"){toast("Qo‘ng‘iroq tugadi");endCall(false)}});
        });
    }).catch(function(){toast("Ulab bo‘lmadi");callRef(inc.cid).update({state:"declined"}).catch(function(){});endCall(false)});
  };
  function endCall(notify){
    clearTimeout(ringTimer);
    if(notify&&callCid)callRef(callCid).update({state:"ended"}).catch(function(){});
    if(ansUnsub){ansUnsub();ansUnsub=null}if(candUnsub){candUnsub();candUnsub=null}
    if(pc){try{pc.close()}catch(e){}pc=null}
    if(localStream){localStream.getTracks().forEach(function(t){t.stop()});localStream=null}
    $("lv").srcObject=null;$("rv").srcObject=null;$("call").classList.remove("on");
    inCall=false;callCid=null;pending=[];
  }
  $("chang").onclick=function(){endCall(true)};
  $("cmute").onclick=function(){if(!localStream)return;var on=false;localStream.getAudioTracks().forEach(function(t){t.enabled=!t.enabled;on=t.enabled});this.textContent=on?"🎤":"🔇"};
  $("ccam").onclick=function(){if(!localStream)return;var on=false;localStream.getVideoTracks().forEach(function(t){t.enabled=!t.enabled;on=t.enabled});this.style.opacity=on?1:.5};
}
</script>
